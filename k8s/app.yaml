apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempconverter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tempconverter
  template:
    metadata:
      labels:
        app: tempconverter
    spec:
      imagePullSecrets:
      - name: quay-secret
      containers:
        - name: app
          image: quay.io/scutvar/tempconverter:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: db
            - name: DB_NAME
              value: tempconverter
            - name: DB_USER
              value: appuser
            - name: DB_PASS
              value: apppass
            - name: STUDENT
              value: Stjepan Cutvaric
            - name: COLLEGE
              value: Algebra Bernays University
---
apiVersion: v1
kind: Service
metadata:
  name: tempconverter
spec:
  selector:
    app: tempconverter
  type: NodePort
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080

