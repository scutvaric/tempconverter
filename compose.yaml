services:
  db:
    image: docker.io/library/mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tempconverter
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: quay.io/scutvar/tempconverter:latest
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: tempconverter
      DB_USER: appuser
      DB_PASS: apppass
      STUDENT: Stjepan Cutvaric
      COLLEGE: Algebra Bernays University
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
